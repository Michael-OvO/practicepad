<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232fbf71'/%3E%3Cpath d='M9 11l6 5-6 5M17 22h7' fill='none' stroke='%2304210f' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
    <title>PracticePad</title>
    <script>
      // Apply the saved (or system) theme before first paint to avoid a flash of the wrong one.
      (function () {
        var theme = "dark";
        try {
          var saved = localStorage.getItem("coderpad-sim:theme");
          if (saved === "light" || saved === "dark") theme = saved;
          else theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        } catch (error) {}
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
